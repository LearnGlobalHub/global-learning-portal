
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create your Global Learning Hub student account.">
<title>Student Registration | Global Learning Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f5f0ff,#e8fbff);
  color:#26324a;min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:25px;
}
.container{
  width:100%;max-width:480px;background:#fff;padding:38px;
  border-radius:22px;box-shadow:0 15px 50px rgba(30,50,100,.12);
}
.brand{text-align:center;margin-bottom:28px}
.brand h1{
  font-size:27px;background:linear-gradient(90deg,#1769e8,#7042e8,#13b8d5);
  -webkit-background-clip:text;color:transparent;
}
.brand p{color:#68748a;margin-top:9px;font-size:14px}
h2{text-align:center;margin-bottom:25px;color:#172554;font-size:23px}
.field{margin-bottom:18px}
label{display:block;margin-bottom:8px;font-weight:600;font-size:14px}
input{
  width:100%;padding:14px;border:1px solid #dce3f0;
  border-radius:10px;font-size:15px;outline:none;
}
input:focus{border-color:#1769e8;box-shadow:0 0 0 3px rgba(23,105,232,.10)}
button{
  width:100%;padding:15px;border:0;border-radius:10px;
  background:linear-gradient(100deg,#1769e8,#7042e8);
  color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px;
}
button:disabled{opacity:.65;cursor:not-allowed}
#message{
  display:none;margin-top:18px;padding:13px;border-radius:9px;
  font-size:14px;line-height:1.5;overflow-wrap:anywhere;
}
.success{display:block!important;background:#e9f9ef;color:#176b39}
.error{display:block!important;background:#fff0f0;color:#b42318}
.bottom{text-align:center;margin-top:24px;font-size:14px;color:#68748a;line-height:1.8}
.bottom a{color:#1769e8;text-decoration:none;font-weight:bold}
.back{display:block;text-align:center;margin-top:18px;color:#7042e8;text-decoration:none;font-size:14px}
.note{margin-top:17px;font-size:12px;color:#68748a;text-align:center;line-height:1.6}
@media(max-width:480px){
  body{padding:15px}
  .container{padding:27px 21px}
  .brand h1{font-size:24px}
}
</style>
</head>

<body>
<div class="container">

  <div class="brand">
    <h1>Global Learning Hub</h1>
    <p>Learn Anywhere. Achieve Beyond Limits.</p>
  </div>

  <h2>Create Student Account</h2>

  <form id="registerForm">
    <div class="field">
      <label for="studentName">Full Name</label>
      <input type="text" id="studentName"
        placeholder="Enter your full name" maxlength="100"
        autocomplete="name" required>
    </div>

    <div class="field">
      <label for="studentEmail">Email Address</label>
      <input type="email" id="studentEmail"
        placeholder="Enter your email address"
        autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password"
        placeholder="Create a password" minlength="6"
        autocomplete="new-password" required>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword"
        placeholder="Re-enter your password" minlength="6"
        autocomplete="new-password" required>
    </div>

    <button type="submit" id="registerButton">Create My Account</button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="bottom">
    Already have an account?<br>
    <a href="student-login.html">Student Login</a>
  </div>

  <a class="back" href="index.html">← Back to Home</a>

  <p class="note">
    Your account details are protected using Firebase Authentication.
    Never share your password with anyone.
  </p>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";

import {
  createUserWithEmailAndPassword,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const form = document.getElementById("registerForm");
const button = document.getElementById("registerButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
  message.style.display = "block";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("studentName").value.trim();
  const email = document.getElementById("studentEmail").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!name || name.length > 100) {
    showMessage("Please enter a valid full name.", "error");
    return;
  }

  if (password.length < 6) {
    showMessage("Password must contain at least 6 characters.", "error");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "Creating Account...";
  message.style.display = "none";

  let accountCreated = false;

  try {
    const credential = await createUserWithEmailAndPassword(
      auth, email, password
    );

    accountCreated = true;

    await setDoc(doc(db, "students", credential.user.uid), {
      name: name,
      email: credential.user.email,
      createdAt: serverTimestamp()
    });

    await sendEmailVerification(credential.user);

    showMessage(
      "Account created successfully! Please check your email and click the verification link before logging in.",
      "success"
    );

    form.reset();

  } catch (error) {
    console.error("Registration error code:", error.code);
    console.error("Registration error message:", error.message);
    console.error("Complete registration error:", error);

    if (accountCreated) {
      showMessage(
        "Your Firebase Authentication account was created, but saving the student profile or sending verification failed. Do not register again. Error: " +
        (error.code || "unknown") + " — " + (error.message || "No additional details"),
        "error"
      );
    } else {
      showMessage(
        "Registration failed. Firebase error: " +
        (error.code || "unknown") + " — " +
        (error.message || "No additional details") +
        ". Please share this error with the website administrator.",
        "error"
      );
    }

  } finally {
    button.disabled = false;
    button.textContent = "Create My Account";
  }
});
</script>
</body>
</html>
