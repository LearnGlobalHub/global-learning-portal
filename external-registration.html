
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef2ff">
<title>Student Registration | Global Learning Hub</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg,#eef2ff,#f5f3ff,#ecfeff);
  color: #172554;
}

header {
  padding: 20px 6%;
  background: linear-gradient(120deg,#101b50,#1769e8,#7042e8);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

header h2 {
  font-size: 22px;
}

header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  background: rgba(255,255,255,.15);
  padding: 11px 18px;
  border-radius: 25px;
}

main {
  max-width: 1200px;
  margin: 35px auto;
  padding: 0 18px;
}

.heading {
  text-align: center;
  margin-bottom: 25px;
}

.heading h1 {
  font-size: 30px;
  background: linear-gradient(90deg,#1769e8,#7042e8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 10px;
}

.heading p {
  color: #475569;
  line-height: 1.6;
}

.form-container {
  background: white;
  padding: 12px;
  border-radius: 20px;
  box-shadow: 0 12px 40px rgba(37,51,110,.13);
  overflow: hidden;
}

iframe {
  display: block;
  width: 100%;
  height: 1500px;
  border: none;
  border-radius: 12px;
  background: white;
}

footer {
  text-align: center;
  padding: 25px 15px;
  color: #64748b;
  font-size: 14px;
}

@media(max-width:600px) {
  header {
    justify-content: center;
    text-align: center;
  }

  .heading h1 {
    font-size: 25px;
  }

  main {
    margin: 22px auto;
    padding: 0 10px;
  }

  .form-container {
    padding: 5px;
  }

  iframe {
    height: 1300px;
  }
}
</style>
</head>

<body>

<header>
  <h2>🌐 Global Learning Hub</h2>
  <a href="index.html">← Back to Home</a>
</header>

<main>
  <div class="heading">
    <h1>Student Registration</h1>
    <p>Register with Global Learning Hub and begin your learning journey.</p>
  </div>

  <div class="form-container">
    <iframe
      src="https://script.google.com/a/macros/vmtw.in/s/AKfycbxtSBomWzn1DurM5MV-HYTDYNpvYBnCu0NvbA-WV8SdQnoUP-EFRepguR6hdXucnOr2/exec"
      title="Global Learning Hub Student Registration"
      loading="lazy"
      allow="clipboard-write">
    </iframe>
  </div>
</main>

<footer>
  © 2026 Global Learning Hub. All Rights Reserved.
</footer>

</body>
</html>
