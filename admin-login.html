
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">
<title>Admin Login | Global Learning Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eff6ff,#f5f3ff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#172554
}
.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:35px;
  border-radius:18px;
  box-shadow:0 12px 40px rgba(30,41,59,.12)
}
.logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  color:#1d4ed8;
  margin-bottom:8px
}
.subtitle{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin-bottom:28px
}
h2{text-align:center;margin-bottom:22px;font-size:23px}
label{display:block;font-weight:600;margin:15px 0 7px}
input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
  outline:none
}
input:focus{border-color:#2563eb}
button{
  width:100%;
  padding:14px;
  margin-top:22px;
  background:#1d4ed8;
  color:white;
  border:0;
  border-radius:9px;
  font-size:16px;
  font-weight:700;
  cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
.message{
  margin-top:16px;
  padding:12px;
  border-radius:8px;
  font-size:14px;
  display:none;
  line-height:1.5
}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#2563eb;
  text-decoration:none;
  font-size:14px
}
.security{
  text-align:center;
  margin-top:22px;
  color:#64748b;
  font-size:12px
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">Global Learning Hub</div>
  <div class="subtitle">Learn Anywhere. Achieve Beyond Limits.</div>

  <h2>Administrator Login</h2>

  <form id="adminLoginForm">

    <label for="email">Admin Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter administrator email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      Secure Admin Login
    </button>

  </form>

  <div id="message" class="message"></div>

  <a class="back" href="index.html">← Back to Website</a>

  <div class="security">
    Restricted access · Authorised administrator only
  </div>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const ADMIN_UID = "eCDFaDWCPvTDkh6Vz0JYGlQd30c2";
const ADMIN_EMAIL = "jeeclassroom@gmail.com";

const form = document.getElementById("adminLoginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Verifying administrator...";

  try {

    if (email !== ADMIN_EMAIL) {
      throw new Error("This email is not authorised for administrator access.");
    }

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = result.user;

    if (
      user.uid !== ADMIN_UID ||
      user.email !== ADMIN_EMAIL
    ) {
      await signOut(auth);
      throw new Error("Unauthorised administrator account.");
    }

    sessionStorage.setItem("glh_admin_verified", "true");

    showMessage("Administrator verified. Opening dashboard...", "success");

    window.location.replace("admin-dashboard.html");

  } catch (error) {

    let errorText = "Login failed. Please check your email and password.";

    if (error.code === "auth/invalid-credential") {
      errorText = "Incorrect email or password.";
    } else if (error.code === "auth/too-many-requests") {
      errorText = "Too many attempts. Please try again later.";
    } else if (error.message.includes("not authorised") ||
               error.message.includes("Unauthorised")) {
      errorText = error.message;
    }

    showMessage(errorText, "error");

  } finally {

    button.disabled = false;
    button.textContent = "Secure Admin Login";

  }

});

</script>

</body>
</html>
