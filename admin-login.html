
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">
<title>Admin Login | Global Learning Hub</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#ede9fe,#cffafe);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#172554;
}

.login-box{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.96);
  padding:35px;
  border-radius:22px;
  border:1px solid white;
  box-shadow:
    0 8px 0 #a5b4fc,
    0 18px 45px rgba(30,41,59,.18);
  transition:.3s ease;
}

.login-box:hover{
  transform:translateY(-4px);
  box-shadow:
    0 12px 0 #a5b4fc,
    0 25px 50px rgba(30,41,59,.2);
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  background:linear-gradient(120deg,#1d4ed8,#7c3aed,#0891b2);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin-bottom:28px;
}

h2{
  text-align:center;
  margin-bottom:22px;
  font-size:23px;
}

label{
  display:block;
  font-weight:600;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
}

input:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px #6366f122;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  background:linear-gradient(120deg,#1d4ed8,#6d28d9,#0891b2);
  color:white;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 5px 0 #312e81;
  transition:.2s;
}

button:hover:not(:disabled){
  transform:translateY(-2px);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:16px;
  padding:12px;
  border-radius:8px;
  font-size:14px;
  display:none;
  line-height:1.5;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
}

.security{
  text-align:center;
  margin-top:22px;
  color:#64748b;
  font-size:12px;
}

@media(max-width:480px){
  .login-box{
    padding:25px 20px;
  }
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">GLOBAL LEARNING HUB</div>

  <div class="subtitle">
    Learn Anywhere. Achieve Beyond Limits.
  </div>

  <h2>Administrator Login</h2>

  <form id="adminLoginForm">

    <label for="email">Admin Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter administrator email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      Secure Admin Login
    </button>

  </form>

  <div id="message" class="message"></div>

  <a class="back" href="index.html">
    ← Back to Website
  </a>

  <div class="security">
    Restricted access · Authorised administrator only
  </div>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const ADMIN_UID = "eCDFaDWCPvTDkh6Vz0JYGlQd30c2";
const ADMIN_EMAIL = "jeeclassroom@gmail.com";

const form = document.getElementById("adminLoginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text,type){

  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";

}

form.addEventListener("submit",async(event)=>{

  event.preventDefault();

  const email = document.getElementById("email")
    .value.trim().toLowerCase();

  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Verifying administrator...";

  message.style.display = "none";

  try{

    if(email !== ADMIN_EMAIL){
      throw new Error(
        "This email is not authorised for administrator access."
      );
    }

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = result.user;

    if(
      user.uid !== ADMIN_UID ||
      user.email !== ADMIN_EMAIL
    ){

      sessionStorage.removeItem("glh_admin_verified");

      await signOut(auth);

      throw new Error(
        "Unauthorised administrator account."
      );

    }

    sessionStorage.setItem(
      "glh_admin_verified",
      "true"
    );

    showMessage(
      "Administrator verified. Opening dashboard...",
      "success"
    );

    window.location.replace(
      new URL("admin-dashboard.html",window.location.href).href
    );

  }catch(error){

    console.error("Admin login error:",error);

    let errorText =
      "Login failed. Please check your email and password.";

    if(error.code === "auth/invalid-credential"){
      errorText = "Incorrect email or password.";
    }
    else if(error.code === "auth/too-many-requests"){
      errorText = "Too many attempts. Please try again later.";
    }
    else if(
      error.message.includes("not authorised") ||
      error.message.includes("Unauthorised")
    ){
      errorText = error.message;
    }
    else if(error.code === "auth/network-request-failed"){
      errorText = "Network error. Please check your internet connection.";
    }

    showMessage(errorText,"error");

  }finally{

    button.disabled = false;
    button.textContent = "Secure Admin Login";

  }

});

</script>

</body>
</html>
