
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">
<title>Course Details | Global Learning Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f5f7ff;
  color:#1e293b;
  min-height:100vh;
}

header{
  background:linear-gradient(120deg,#172554,#1d4ed8,#6d28d9);
  color:white;
  padding:20px 5%;
}

header h1{font-size:23px}
header p{font-size:13px;margin-top:5px;color:#dbeafe}

.container{
  max-width:950px;
  margin:35px auto;
  padding:0 18px;
}

.back{
  display:inline-block;
  color:#2563eb;
  text-decoration:none;
  margin-bottom:20px;
  font-weight:bold;
}

.card{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 22px rgba(15,23,42,.07);
  border:1px solid #e2e8f0;
}

.category{
  display:inline-block;
  background:#e0e7ff;
  color:#3730a3;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

h2{
  font-size:28px;
  color:#172554;
  margin-bottom:15px;
}

.description{
  color:#64748b;
  line-height:1.7;
  margin-bottom:25px;
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-bottom:25px;
}

.info-item{
  background:#f8fafc;
  padding:16px;
  border-radius:10px;
}

.info-item span{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-bottom:7px;
}

.info-item strong{
  color:#172554;
  overflow-wrap:anywhere;
}

.section{
  border-top:1px solid #e2e8f0;
  padding-top:23px;
  margin-top:20px;
}

.section h3{
  font-size:19px;
  margin-bottom:12px;
}

.section p{
  color:#64748b;
  line-height:1.6;
}

.enrol-button{
  width:100%;
  margin-top:20px;
  padding:15px;
  background:linear-gradient(100deg,#1d4ed8,#6d28d9);
  color:white;
  border:0;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.enrol-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:17px;
  padding:14px;
  border-radius:9px;
  font-size:14px;
  line-height:1.5;
}

.status.success{display:block;background:#dcfce7;color:#166534}
.status.warning{display:block;background:#fef3c7;color:#92400e}
.status.error{display:block;background:#fee2e2;color:#991b1b}

footer{
  text-align:center;
  padding:25px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:550px){
  .container{margin:22px auto}
  .card{padding:21px}
  h2{font-size:23px}
  .info{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>Global Learning Hub</h1>
  <p>Learn Anywhere. Achieve Beyond Limits.</p>
</header>

<main class="container">

  <a class="back" href="courses.html">← Back to Courses</a>

  <div class="card">

    <div id="courseContent">
      <p>Loading course details...</p>
    </div>

  </div>

</main>

<footer>
  Global Learning Hub | Learn Today. Lead Tomorrow.
</footer>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const courseId = new URLSearchParams(window.location.search).get("id");

const courseContent = document.getElementById("courseContent");

let currentUser = null;
let currentCourse = null;
let isVerified = false;

function showMessage(message, type) {

  const box = document.getElementById("enrolStatus");

  if (!box) return;

  box.textContent = message;
  box.className = "status " + type;

}

function showError(message) {

  courseContent.textContent = message;

}

onAuthStateChanged(auth, async (user) => {

  currentUser = user;

  if (!user) {

    showError("Please log in to view course details and enrol.");
    return;

  }

  if (!user.emailVerified) {

    showError("Please verify your email address before enrolling.");
    return;

  }

  if (!courseId) {

    showError("Course ID is missing. Please open a course from the Courses page.");
    return;

  }

  isVerified = true;

  await loadCourse();

});

async function loadCourse() {

  try {

    const courseRef = doc(db, "courses", courseId);
    const courseSnap = await getDoc(courseRef);

    if (!courseSnap.exists()) {

      showError("This course could not be found.");
      return;

    }

    currentCourse = courseSnap.data();

    if (currentCourse.status !== "published") {

      showError("This course is not currently available.");
      return;

    }

    renderCourse();
    await checkExistingEnrolment();

  } catch (error) {

    console.error(error);
    showError("Unable to load course details. Please try again.");

  }

}

function renderCourse() {

  courseContent.replaceChildren();

  const category = document.createElement("div");
  category.className = "category";
  category.textContent = currentCourse.category || "General";

  const title = document.createElement("h2");
  title.textContent = currentCourse.title || "Untitled Course";

  const description = document.createElement("p");
  description.className = "description";
  description.textContent =
    currentCourse.description || "Explore this course and develop your knowledge.";

  const info = document.createElement("div");
  info.className = "info";

  const level = document.createElement("div");
  level.className = "info-item";
  level.innerHTML = "<span>Course Level</span>";

  const levelValue = document.createElement("strong");
  levelValue.textContent = currentCourse.level || "Not specified";
  level.appendChild(levelValue);

  const categoryInfo = document.createElement("div");
  categoryInfo.className = "info-item";
  categoryInfo.innerHTML = "<span>Subject Category</span>";

  const categoryValue = document.createElement("strong");
  categoryValue.textContent = currentCourse.category || "General";
  categoryInfo.appendChild(categoryValue);

  info.append(level, categoryInfo);

  const syllabus = document.createElement("div");
  syllabus.className = "section";

  const syllabusTitle = document.createElement("h3");
  syllabusTitle.textContent = "Course Syllabus";

  const syllabusText = document.createElement("p");
  syllabusText.textContent =
    currentCourse.syllabus || "Course syllabus will be updated soon.";

  syllabus.append(syllabusTitle, syllabusText);

  const enrolSection = document.createElement("div");
  enrolSection.className = "section";

  const enrolTitle = document.createElement("h3");
  enrolTitle.textContent = "Course Enrolment";

  const enrolText = document.createElement("p");
  enrolText.textContent =
    "Submit your enrolment request to join this course. Your request will be reviewed by the administrator.";

  const enrolButton = document.createElement("button");
  enrolButton.id = "enrolButton";
  enrolButton.className = "enrol-button";
  enrolButton.textContent = "Enrol Now";

  const status = document.createElement("div");
  status.id = "enrolStatus";
  status.className = "status";

  enrolButton.addEventListener("click", submitEnrolment);

  enrolSection.append(
    enrolTitle,
    enrolText,
    enrolButton,
    status
  );

  courseContent.append(
    category,
    title,
    description,
    info,
    syllabus,
    enrolSection
  );

}

async function checkExistingEnrolment() {

  const enrolButton = document.getElementById("enrolButton");

  if (!enrolButton) return;

  try {

    const enrollmentId = currentUser.uid + "_" + courseId;

    const enrollmentRef = doc(db, "enrollments", enrollmentId);

    const enrollmentSnap = await getDoc(enrollmentRef);

    if (enrollmentSnap.exists()) {

      const data = enrollmentSnap.data();

      enrolButton.disabled = true;

      if (data.status === "approved") {

        enrolButton.textContent = "Already Enrolled";
        showMessage("Your enrolment has been approved. You are enrolled in this course.", "success");

      } else if (data.status === "rejected") {

        enrolButton.textContent = "Enrolment Rejected";
        showMessage("Your enrolment request was rejected. Please contact the administrator.", "error");

      } else {

        enrolButton.textContent = "Request Submitted";
        showMessage("Your enrolment request is pending administrator approval.", "warning");

      }

    }

  } catch (error) {

    console.error(error);
    showMessage("Unable to check your existing enrolment. Please refresh the page.", "error");

  }

}

async function submitEnrolment() {

  const enrolButton = document.getElementById("enrolButton");

  if (!currentUser || !isVerified || !currentCourse) {

    showMessage("Please log in with your verified student account.", "error");
    return;

  }

  const confirmed = confirm(
    "Do you want to submit your enrolment request for this course?"
  );

  if (!confirmed) return;

  enrolButton.disabled = true;
  enrolButton.textContent = "Submitting Request...";

  try {

    const enrollmentId = currentUser.uid + "_" + courseId;

    const enrollmentRef = doc(db, "enrollments", enrollmentId);

    await setDoc(enrollmentRef, {

      studentId: currentUser.uid,
      studentEmail: currentUser.email,
      courseId: courseId,
      courseTitle: currentCourse.title,
      status: "pending",
      enrolledAt: serverTimestamp()

    });

    enrolButton.textContent = "Request Submitted";

    showMessage(
      "Your enrolment request has been submitted successfully. Please wait for administrator approval.",
      "success"
    );

  } catch (error) {

    console.error(error);

    enrolButton.disabled = false;
    enrolButton.textContent = "Enrol Now";

    if (error.code === "permission-denied") {

      showMessage(
        "Enrolment could not be submitted. Please check whether this course is published and your account is verified.",
        "error"
      );

    } else {

      showMessage(
        "Unable to submit your enrolment request. Please try again.",
        "error"
      );

    }

  }

}

</script>

</body>
</html>
