
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Student login to Global Learning Hub.">
<title>Student Login | Global Learning Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f5f0ff,#e8fbff);
  color:#26324a;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:440px;
  background:#fff;
  padding:38px;
  border-radius:22px;
  box-shadow:0 15px 50px rgba(30,50,100,.12);
}

.brand{text-align:center;margin-bottom:30px}

.brand h1{
  font-size:27px;
  background:linear-gradient(90deg,#1769e8,#7042e8,#13b8d5);
  -webkit-background-clip:text;
  color:transparent;
}

.brand p{color:#68748a;margin-top:9px;font-size:14px}

h2{text-align:center;color:#172554;margin-bottom:25px;font-size:23px}

.field{margin-bottom:19px}

label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}

input{
  width:100%;
  padding:14px;
  border:1px solid #dce3f0;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#1769e8;
  box-shadow:0 0 0 3px rgba(23,105,232,.10);
}

.forgot{text-align:right;margin-top:-8px;margin-bottom:20px}

.forgot a,.links a{
  color:#1769e8;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:linear-gradient(100deg,#1769e8,#7042e8);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{opacity:.65;cursor:not-allowed}

#message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:9px;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.success{display:block!important;background:#e9f9ef;color:#176b39}
.error{display:block!important;background:#fff0f0;color:#b42318}

.links{
  text-align:center;
  margin-top:24px;
  color:#68748a;
  font-size:14px;
  line-height:2;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#7042e8;
  text-decoration:none;
  font-size:14px;
}

@media(max-width:480px){
  .container{padding:28px 21px}
  .brand h1{font-size:24px}
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <h1>Global Learning Hub</h1>
    <p>Learn Anywhere. Achieve Beyond Limits.</p>
  </div>

  <h2>Student Login</h2>

  <form id="loginForm">

    <div class="field">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required>
    </div>

    <div class="forgot">
      <a href="#" id="forgotPassword">Forgot Password?</a>
    </div>

    <button type="submit" id="loginButton">Login to Account</button>

  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="links">
    Don't have an account?<br>
    <a href="student-register.html">Create Student Account</a>
  </div>

  <a class="back" href="index.html">← Back to Home</a>

</div>

<script type="module">
import { auth } from "./firebase-config.js";

import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  sendEmailVerification,
  signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text,type){
  message.textContent = text;
  message.className = type;
}

form.addEventListener("submit",async function(event){
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Checking...";
  message.className = "";

  try{
    const credential = await signInWithEmailAndPassword(
      auth,email,password
    );

    if(!credential.user.emailVerified){
      try{
        await sendEmailVerification(credential.user);
      }catch(e){
        console.error("Verification email error:",e);
      }

      await signOut(auth);

      showMessage(
        "Your email address is not verified. Please check your inbox " +
        "and click the verification link. A new verification email " +
        "has been requested.",
        "error"
      );

      return;
    }

    showMessage("Login successful. Opening your dashboard...","success");

    window.location.href = "student-dashboard.html";

  }catch(error){
    console.error("Login error:",error);

    let errorText = "Login failed. Please try again.";

    if(
      error.code === "auth/invalid-credential" ||
      error.code === "auth/wrong-password" ||
      error.code === "auth/user-not-found"
    ){
      errorText = "Incorrect email address or password.";
    }else if(error.code === "auth/invalid-email"){
      errorText = "Please enter a valid email address.";
    }else if(error.code === "auth/too-many-requests"){
      errorText = "Too many attempts. Please try again later.";
    }else if(error.code === "auth/network-request-failed"){
      errorText = "Network error. Please check your internet connection.";
    }

    showMessage(errorText,"error");

  }finally{
    button.disabled = false;
    button.textContent = "Login to Account";
  }
});

document.getElementById("forgotPassword").addEventListener(
  "click",async function(event){
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if(!email){
      showMessage(
        "Please enter your registered email address first.",
        "error"
      );
      document.getElementById("email").focus();
      return;
    }

    try{
      await sendPasswordResetEmail(auth,email);

      showMessage(
        "If this email is registered, a password reset link will be sent. " +
        "Please check your inbox and spam folder.",
        "success"
      );

    }catch(error){
      console.error("Password reset error:",error);

      if(error.code === "auth/invalid-email"){
        showMessage("Please enter a valid email address.","error");
      }else if(error.code === "auth/too-many-requests"){
        showMessage("Too many requests. Please try again later.","error");
      }else{
        showMessage(
          "Unable to process the request. Please try again later.",
          "error"
        );
      }
    }
  }
);
</script>

</body>
</html>
